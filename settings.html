<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-hospital"></i> <span>HMS</span></div>
        <nav class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
          <a class="nav-link" href="patients.html"><i class="fa-solid fa-bed-pulse"></i> Patients</a>
          <a class="nav-link" href="doctors.html"><i class="fa-solid fa-user-doctor"></i> Doctors</a>
          <a class="nav-link" href="appointments.html"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
          <a class="nav-link" href="profile.html"><i class="fa-solid fa-id-card"></i> Profile</a>
          <a class="nav-link active" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
      </aside>
      <main class="main-area">
        <div class="topbar">
          <div class="page-title">
            <h2 class="fw-bold mb-1">Settings</h2>
            <p>Customize the application experience.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-outline-secondary" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="card p-4">
              <h5 class="fw-bold mb-3">Preferences</h5>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="themeToggle">
                <label class="form-check-label" for="themeToggle">Enable Dark Mode</label>
              </div>
              <button class="btn btn-primary mt-3" id="saveSettingsBtn">Save Preferences</button>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card p-4">
              <h5 class="fw-bold mb-3">Data Management</h5>
              <button class="btn btn-outline-danger mb-2" id="clearDataBtn">Clear All Data</button>
              <button class="btn btn-outline-warning mb-2" id="resetAppBtn">Reset Application</button>
              <button class="btn btn-outline-success mb-2" id="exportBtn">Export JSON</button>
              <input type="file" id="importFile" class="form-control mt-2" accept="application/json" />
              <button class="btn btn-outline-info mt-2" id="importBtn">Import JSON</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
