<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/login.css" />
    <link rel="stylesheet" href="assets/responsive.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand"><i class="fa-solid fa-hospital"></i> HMS</div>
        <h2 id="authTitle" class="fw-bold">Create account</h2>
        <p id="authSubtitle" class="muted">Register a new admin account to access the hospital dashboard.</p>
        <form id="authForm">
          <input type="hidden" id="authMode" value="register" />
          <div class="form-floating">
            <input class="form-control" id="fullName" name="fullName" placeholder="Full Name" required />
            <label for="fullName">Full Name</label>
          </div>
          <div class="form-floating">
            <input class="form-control" id="email" name="email" type="email" placeholder="Email" required />
            <label for="email">Email Address</label>
          </div>
          <div class="form-floating">
            <input class="form-control" id="mobile" name="mobile" placeholder="Mobile Number" required />
            <label for="mobile">Mobile Number</label>
          </div>
          <div class="form-floating position-relative">
            <input class="form-control" id="password" name="password" type="password" placeholder="Password" required />
            <label for="password">Password</label>
            <button class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2" id="togglePassword" type="button"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="form-floating">
            <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" required />
            <label for="confirmPassword">Confirm Password</label>
          </div>
          <button class="btn btn-primary w-100 btn-animated mt-3" type="submit">Register</button>
        </form>
        <div class="divider">or</div>
        <p class="text-center mb-0">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
    <div id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/storage.js"></script>
    <script src="assets/validation.js"></script>
    <script src="assets/auth.js"></script>
  </body>
</html>
