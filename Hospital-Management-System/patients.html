<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patients | Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/responsive.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-hospital"></i> <span>HMS</span></div>
        <nav class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
          <a class="nav-link active" href="patients.html"><i class="fa-solid fa-bed-pulse"></i> Patients</a>
          <a class="nav-link" href="doctors.html"><i class="fa-solid fa-user-doctor"></i> Doctors</a>
          <a class="nav-link" href="appointments.html"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
          <a class="nav-link" href="profile.html"><i class="fa-solid fa-id-card"></i> Profile</a>
          <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
      </aside>
      <main class="main-area">
        <div class="topbar">
          <div class="page-title">
            <h2 class="fw-bold mb-1">Patient Records</h2>
            <p>Manage admissions, diagnosis, and patient status.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-primary btn-animated" id="addPatientBtn"><i class="fa-solid fa-plus"></i> Add Patient</button>
            <button class="btn btn-outline-secondary" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
        <div class="card p-4">
          <div class="row g-2 mb-3">
            <div class="col-md-4"><input id="patientSearch" class="form-control" placeholder="Search patients" /></div>
            <div class="col-md-2"><select id="patientStatusFilter" class="form-select"><option value="">All Status</option><option>Admitted</option><option>Discharged</option><option>Critical</option></select></div>
            <div class="col-md-2"><select id="patientSort" class="form-select"><option value="name">Sort by Name</option><option value="date">Sort by Date</option></select></div>
            <div class="col-md-2"><button class="btn btn-outline-success w-100" id="exportPatientsBtn">Export CSV</button></div>
            <div class="col-md-2"><button class="btn btn-outline-secondary w-100" id="printPatientsBtn">Print Report</button></div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Disease</th><th>Status</th><th>Admission</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="patientsTableBody"></tbody>
            </table>
          </div>
          <div class="empty-state d-none" id="patientsEmpty">No patients recorded yet.</div>
        </div>
      </main>
    </div>
    <div class="modal fade" id="patientModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Patient Form</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="patientModalBody"></div>
        </div>
      </div>
    </div>
    <div id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/storage.js"></script>
    <script src="assets/common.js"></script>
    <script src="assets/patients.js"></script>
  </body>
</html>
