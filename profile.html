<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-hospital"></i> <span>HMS</span></div>
        <nav class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
          <a class="nav-link" href="patients.html"><i class="fa-solid fa-bed-pulse"></i> Patients</a>
          <a class="nav-link" href="doctors.html"><i class="fa-solid fa-user-doctor"></i> Doctors</a>
          <a class="nav-link" href="appointments.html"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
          <a class="nav-link active" href="profile.html"><i class="fa-solid fa-id-card"></i> Profile</a>
          <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
      </aside>
      <main class="main-area">
        <div class="topbar">
          <div class="page-title">
            <h2 class="fw-bold mb-1">Profile</h2>
            <p>Manage your personal account details.</p>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-outline-secondary" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
        <div class="card p-4">
          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" id="profileName" required></div>
              <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="profileEmail" type="email" required></div>
              <div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" id="profileMobile"></div>
              <div class="col-md-6"><label class="form-label">Password</label><input class="form-control" id="profilePassword"></div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Update Profile</button>
          </form>
        </div>
      </main>
    </div>
    <div id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
